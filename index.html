<title>Soundic Legal</title>
<style>
  :root {
    --ground: #f7f6fa;
    --surface: #ffffff;
    --text: #171a24;
    --muted: #5b6274;
    --faint: #8b91a3;
    --rule: #e7e4ef;
    --accent: #d81b78;
    --accent-soft: #fbe9f3;
    --ring: rgba(216, 27, 120, 0.35);
    --measure: 43rem;
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
      system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0e1a2c;
      --surface: #142238;
      --text: #e9ecf4;
      --muted: #9ba6bd;
      --faint: #6f7c96;
      --rule: #22344f;
      --accent: #ff5aa8;
      --accent-soft: rgba(255, 90, 168, 0.12);
      --ring: rgba(255, 90, 168, 0.45);
    }
  }
  :root[data-theme="light"] {
    --ground: #f7f6fa; --surface: #ffffff; --text: #171a24; --muted: #5b6274;
    --faint: #8b91a3; --rule: #e7e4ef; --accent: #d81b78;
    --accent-soft: #fbe9f3; --ring: rgba(216, 27, 120, 0.35);
  }
  :root[data-theme="dark"] {
    --ground: #0e1a2c; --surface: #142238; --text: #e9ecf4; --muted: #9ba6bd;
    --faint: #6f7c96; --rule: #22344f; --accent: #ff5aa8;
    --accent-soft: rgba(255, 90, 168, 0.12); --ring: rgba(255, 90, 168, 0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.85;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--measure); margin: 0 auto; padding: 0 24px 96px; }

  header.masthead {
    padding: 72px 0 34px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 40px;
    position: relative;
  }
  header.masthead::before {
    content: "";
    position: absolute; top: 0; left: 0; width: 54px; height: 4px;
    border-radius: 4px;
    background: linear-gradient(90deg, #2bf5ea, var(--accent) 55%, #ffd65c);
  }
  .eyebrow {
    font-size: 12px; font-weight: 800; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(29px, 6vw, 40px); font-weight: 800; line-height: 1.2;
    margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance;
  }
  .updated {
    font-size: 13.5px; color: var(--faint); margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .intro { color: var(--muted); font-size: 16.5px; margin: 0 0 8px; }

  section { margin-top: 44px; }
  h2 {
    display: flex; align-items: baseline; gap: 12px;
    font-size: 20px; font-weight: 800; letter-spacing: -0.01em;
    margin: 0 0 14px; text-wrap: balance;
  }
  h2 .num {
    flex: none; font-size: 13px; font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 1.7em; text-align: right;
  }
  h3 {
    font-size: 15px; font-weight: 700; color: var(--text);
    margin: 22px 0 8px;
  }
  p { margin: 0 0 12px; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--ring); }
  a:hover { border-bottom-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  ul, ol { margin: 6px 0 14px; padding-left: 0; list-style: none; }
  li { position: relative; padding-left: 26px; margin-bottom: 9px; color: var(--text); }
  ul li::before {
    content: ""; position: absolute; left: 6px; top: 0.72em;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }
  ol { counter-reset: item; }
  ol li { counter-increment: item; }
  ol li::before {
    content: counter(item); position: absolute; left: 0; top: 0;
    font-size: 12.5px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums; line-height: 1.85;
  }
  li strong { font-weight: 700; }

  .callout {
    background: var(--accent-soft);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 12px;
  }
  .callout p { margin: 0; }
  .contact-mail {
    font-weight: 700; font-size: 16px;
  }

  footer {
    margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule);
    color: var(--faint); font-size: 13px;
  }
  footer .brand { color: var(--muted); font-weight: 700; }
</style>
